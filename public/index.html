<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto qeydiyyatı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="modal-back" id="rules" role="dialog" aria-modal="true" aria-labelledby="ruleTitle">
  <div class="modal">
    <p class="modal-count"><span id="ruleNo">1</span> / <span id="ruleTotal">4</span></p>
    <h2 id="ruleTitle">Şəkil çəkilməzdən əvvəl</h2>
    <p class="modal-text" id="ruleText">Eynək və papağı çıxarın.</p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="ruleBack" disabled>Geri</button>
      <button type="button" class="btn primary" id="ruleNext">Növbəti</button>
    </div>
  </div>
</div>

<header class="site-head">
  <h1>Foto qeydiyyatı</h1>
  <p>Üzünüzü çərçivənin mərkəzinə tutun. Şəkil yalnız üz tanınandan sonra çəkilir.</p>
</header>

<main class="layout">

  <!-- ADDIM 1: ÜZ ŞƏKLİ -->
  <section class="stage" aria-label="Şəkil çəkmə">
    <p class="step-tag">Addım 1 — şəkil</p>
    <div class="viewport" id="viewport">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
      <img id="preview" alt="Çəkilmiş şəkil" hidden>
      <div class="guide" id="guide" aria-hidden="true"></div>

      <div class="veil" id="veil">
        <p id="veilText">Kamera hazırlanır…</p>
        <button type="button" class="btn ghost" id="startBtn" hidden>Kameranı işə sal</button>
      </div>
    </div>

    <div class="readout" id="readout" data-state="wait">
      <span class="dot"></span>
      <span id="statusText">Model yüklənir…</span>
    </div>

    <div class="stage-actions">
      <button type="button" class="btn primary" id="shootBtn" disabled>Şəkli çək</button>
      <button type="button" class="btn ghost" id="retakeBtn" hidden>Yenidən çək</button>
    </div>
  </section>

  <!-- ADDIM 2: MƏLUMATLAR -->
  <section class="form-panel" aria-label="Şəxs məlumatları">
    <p class="step-tag">Addım 2 — məlumatlar</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="ad">Ad</label>
        <input id="ad" name="ad" type="text" autocomplete="given-name" required>
      </div>

      <div class="field">
        <label for="soyad">Soyad</label>
        <input id="soyad" name="soyad" type="text" autocomplete="family-name" required>
      </div>

      <div class="field">
        <label for="struktur">Struktur bölməsi</label>
        <input id="struktur" name="struktur" type="text" required>
      </div>

      <div class="field">
        <label for="vezife">Vəzifə</label>
        <input id="vezife" name="vezife" type="text" required>
      </div>

      <p class="note" id="fileHint">Fayl adı: —</p>

      <button type="submit" class="btn send" id="sendBtn" disabled>Göndər</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </section>

</main>

<canvas id="shot" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script src="app.js"></script>
</body>
</html>
